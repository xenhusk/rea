name: Sync upstream

on:
  schedule:
    # Hourly, offset from the top of the hour. GitHub may delay scheduled runs.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Disable upstream workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${{ github.repository }}/actions/workflows" \
            --jq '.workflows[] | select(.path != ".github/workflows/sync-upstream.yml" and .state == "active") | .id' |
            while read -r id; do
              [ -z "${id}" ] && continue
              gh api --method PUT "repos/${{ github.repository }}/actions/workflows/${id}/disable"
            done

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync from upstream
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/morluto/rea.git
          git fetch upstream --prune '+refs/heads/*:refs/remotes/upstream/*' 'refs/tags/*:refs/tags/*'

          git checkout main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "main already contains upstream/main"
          else
            # The Actions token cannot create or update .github/workflows.
            # Keep the fork's workflow files and sync the rest of the tree.
            workflow_backup="$(mktemp -d)"
            cp -a .github/workflows "${workflow_backup}/workflows"
            merge_status=0
            git merge --no-commit --no-ff upstream/main || merge_status=$?
            if [ "${merge_status}" -gt 1 ]; then
              echo "git merge failed"
              exit "${merge_status}"
            fi
            rm -rf .github/workflows
            mkdir -p .github
            cp -a "${workflow_backup}/workflows" .github/workflows
            git add -A -- .github/workflows
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Merge conflicts remain outside workflow files:"
              git diff --name-only --diff-filter=U
              exit 1
            fi
            if git diff --cached --quiet && git diff --quiet; then
              git commit --allow-empty -m "Sync upstream main [skip ci]"
            else
              git commit -m "Sync upstream main [skip ci]"
            fi
            git push origin main
          fi

          # Publish new upstream tags. Keep tags already stored on this fork
          # when a tag name cannot move fast-forward.
          git push origin --tags || echo "Some tags were left unchanged."

          git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/upstream |
            while read -r branch; do
              [ "${branch}" = "HEAD" ] && continue
              [ "${branch}" = "main" ] && continue
              echo "Updating ${branch}"
              git push origin "refs/remotes/upstream/${branch}:refs/heads/${branch}" \
                || echo "Left ${branch} unchanged."
            done
