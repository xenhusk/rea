name: Sync upstream

on:
  schedule:
    # Hourly, offset from the top of the hour. GitHub may delay scheduled runs.
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Disable upstream workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${{ github.repository }}/actions/workflows" \
            --jq '.workflows[] | select(.path != ".github/workflows/sync-upstream.yml" and .state == "active") | .id' |
            while read -r id; do
              [ -z "${id}" ] && continue
              gh api --method PUT "repos/${{ github.repository }}/actions/workflows/${id}/disable"
            done

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Sync from upstream
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/morluto/rea.git
          git fetch upstream --prune '+refs/heads/*:refs/remotes/upstream/*' 'refs/tags/*:refs/tags/*'

          git checkout main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "main already contains upstream/main"
          else
            git merge --no-edit upstream/main -m "Sync upstream main [skip ci]"
            git push origin main
          fi

          # Publish new upstream tags. Keep tags already stored on this fork
          # when a tag name cannot move fast-forward.
          git push origin --tags || echo "Some tags were left unchanged."

          git for-each-ref --format='%(refname:lstrip=3)' refs/remotes/upstream |
            while read -r branch; do
              [ "${branch}" = "HEAD" ] && continue
              [ "${branch}" = "main" ] && continue
              echo "Updating ${branch}"
              git push origin "refs/remotes/upstream/${branch}:refs/heads/${branch}" \
                || echo "Left ${branch} unchanged because it is not a fast-forward."
            done
